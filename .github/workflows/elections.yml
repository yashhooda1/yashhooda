# .github/workflows/elections.yml
# US elections pipeline (pipelines/elections/) — bronze -> silver -> gold for #elections.
#
#  * pull_request / push: re-check the committed gold JSON against certified totals
#    (pipelines/elections/checks.csv). Fast: no downloads.
#  * workflow_dispatch: fetch bronze from the public sources, rebuild silver + gold,
#    run the same gate, and open a PR with the refreshed data if anything changed.
#    Run it after dropping a certified 2026 county file into data/elections/bronze/2026/.
# Python standard library only, so there is no install step.
name: Elections

on:
  push:
    branches: [main]
    paths: ['pipelines/elections/**', 'data/elections/**', '.github/workflows/elections.yml']
  pull_request:
    paths: ['pipelines/elections/**', 'data/elections/**', '.github/workflows/elections.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gold totals vs certified results (±1.5%)
        run: python pipelines/elections/build.py --check-only
      - name: Race-by-race chamber totals (Senate, House, governors, electoral votes)
        run: python pipelines/elections/build_races.py --check-only

  rebuild:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch bronze
        run: bash pipelines/elections/fetch_bronze.sh
      - name: Build silver + gold, then gate
        run: python pipelines/elections/build.py --check
      - name: Build race-by-race gold, then gate
        run: python pipelines/elections/build_races.py --check
      - name: Open a PR with refreshed data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rebuild always stamps a new generated_at; put back any file whose only change is that stamp.
          for f in $(git diff --name-only -- 'data/elections/**/*.json'); do
            if python3 -c "import json,subprocess,sys; o=json.loads(subprocess.check_output(['git','show','HEAD:'+sys.argv[1]])); n=json.load(open(sys.argv[1])); [d.pop('generated_at',None) for d in (o,n)]; sys.exit(0 if o==n else 1)" "$f"; then
              git checkout -- "$f"
            fi
          done
          if git diff --quiet -- data/elections; then echo "No data changes (timestamps only)."; exit 0; fi
          branch="data/elections-refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/elections
          git commit -m "data(elections): refresh gold from pipeline run ${GITHUB_RUN_ID}"
          git push origin "$branch"
          # Opening the PR needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
          # Without it the branch is still pushed, so warn with the link instead of failing the run.
          if ! gh pr create --title "Elections data refresh" --body "Automated rebuild of data/elections from pipelines/elections (run ${GITHUB_RUN_ID}). Certified-total gate passed." --base main --head "$branch"; then
            echo "::warning::Pushed $branch but couldn't open the PR (Actions isn't allowed to create PRs in this repo). Open it here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          fi
